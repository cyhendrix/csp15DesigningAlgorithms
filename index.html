/* Chapter 6 opening screen */
.student-screen{width:min(1000px,92vw);margin:20px auto}
.student-card{border:3px solid #f4c42e;background:#fffaf0;border-radius:17px;overflow:hidden;box-shadow:0 3px 12px #0001}

.student-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:16px 0}

[hidden]{display:none!important}

</style></head><body><header class="hero"><div class="inner"><p class="eyebrow">COMPUTER SCIENCE FOUNDATIONS</p><h1>Chapter 15: Designing Algorithms</h1><p class="subtitle">Interactive Practice Lab • Three Lessons</p></div></header><main><section class="panel lesson-overview" id="lessonOverview" hidden><h2>How this practice works</h2><p>Work through each lesson. You have two attempts per question. Finish all checks to unlock Results.</p><nav class="tabs" id="tabs"></nav></section><div class="status" id="status" hidden></div><section id="content"></section></main><script>
const DATA={"lessons":[{"title":"Designing with Flowcharts","intro":"An algorithm is a set of precise steps. Rectangles represent actions, diamonds decisions, arrows program flow. Flowcharts can show sequence, branching, and loops.","code":"score = 75\nif score >= 70:\n    print('Pass')\nelse:\n    print('Retry')","questions":[["Which flowchart symbol shows a decision?",["Diamond","Rectangle","Arrow"],0],["Which flowchart shape represents an action?",["Rectangle","Diamond","Arrow"],0],["Which control structure repeats a group of steps?",["Iteration","Selection","Sequence"],0]],"task":"Arrange a simple flowchart algorithm as ordered steps","lines":["START","Get score","Decide if score >= 70","Display Pass or Retry"]},{"title":"Writing Pseudocode","intro":"Pseudocode is a human-readable algorithm outline without strict Python syntax. The left arrow assigns values. IF chooses a branch, REPEAT describes looping, PROCEDURE names a function.","code":"score ← 70\nIF (score >= 70)\n{\n  DISPLAY \"Pass\"\n}","questions":[["Why write pseudocode first?",["To plan logic without exact language syntax","To run the final program","To replace testing"],0],["What does score ← 100 mean?",["Assign 100 to score","Print score 100 times","Compare 100 and score"],0],["What does PROCEDURE describe in pseudocode?",["A reusable function","A flowchart arrow","A program error"],0]],"task":"Arrange the steps in a password-checking algorithm","lines":["password ← INPUT()","IF (password = \"secret\")","DISPLAY \"Welcome\""]},{"title":"Common Math Algorithms","intro":"Some algorithms are sequential, while others use decisions and iteration. Calculate circle area using πr²; make change using larger coins first; find GCD by repeatedly reducing values; identify primes by testing divisibility.","code":"import math\nradius = 2\narea = math.pi * radius * radius\nprint(round(area,2))","questions":[["Circle area can be calculated with what type of simple algorithm?",["Sequential","Branching only","Iterative only"],0],["When making change with coins, which coin should you test first?",["Largest usable coin","Smallest coin","A random coin"],0],["What is the greatest common divisor of 12 and 8?",["4","2","8"],0]],"task":"Arrange the steps for calculating the area of a circle","lines":["radius = 2","area = math.pi * radius * radius","print(area)"]}],"vocab":[[["algorithm","Ordered steps for solving a problem"],["flowchart","Diagram showing a program's logic"],["rectangle","Flowchart shape used for actions"],["diamond","Flowchart shape used for decisions"]],[["pseudocode","Readable outline of an algorithm"],["assignment","Stores a value into a variable"],["selection","Decision that chooses what runs"],["iteration","Repeats a group of steps"]],[["sequential","Runs instructions in order"],["greatest common divisor","Largest number that divides two integers"],["prime","Whole number with exactly two positive divisors"],["efficiency","Solving a task with fewer resources or steps"]]],"blanks":[[{"prompt":"Complete the condition in this Python branching statement","code":"score = 75\n___ score >= 70:\n    print('Pass')","answer":"if","options":[]},{"prompt":"Complete the output function","code":"if score >= 70:\n    ___('Pass')","answer":"print","options":[]}],[{"prompt":"Look at the assignment statement. Use the dropdown to select the pseudocode symbol that stores a value in a variable. Choose the symbol that belongs in the blank.","code":"score ___ 100","answer":"←","options":[]},{"prompt":"Look at the message in quotation marks. Replace the underscores with the pseudocode keyword that tells the program to show a message. Enter only the missing keyword, not the entire line.","code":"___ \"Welcome\"","answer":"DISPLAY","options":[]}],[{"prompt":"Complete the name of the math constant used for circle area","code":"area = math.___ * radius * radius","answer":"pi","options":[]},{"prompt":"Complete the loop keyword in the GCD subtraction algorithm","code":"___ a != b:\n    if a > b: a -= b\n    else: b -= a","answer":"while","options":[]}]]};const KEY="csp15DesigningAlgorithms_activity_v1";let state={first:"",last:"",period:"",tab:"Student Info",lesson:0,answers:{},orders:{},positions:{},completed:{},attempts:{},submitted:false};

const tabs=["Student Info","Lesson 1","Lesson 2","Lesson 3","Results"];const STARTED="csp15-algorithms-started";if(sessionStorage.getItem(STARTED)!=="1")state.tab="Student Info";const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const id=(t,i,j)=>t+"-"+i+"-"+j;
const tries=k=>state.attempts[k]||0;const locked=k=>!!state.completed[k]||tries(k)>=2;const allCount=()=>{let count=0;for(let i=0;i<3;i++){for(let j=0;j<4;j++)if(locked(id("v",i,j)))count++;for(let j=0;j<2;j++)if(locked(id("f",i,j)))count++;if(locked(id("o",i,0)))count++;for(let j=0;j<3;j++)if(locked(id("q",i,j)))count++}return count};

else{let i=state.lesson;h='<section class="panel"><h2>Lesson '+(i+1)+': '+esc(DATA.lessons[i].title)+'</h2><p class="small"><b>Instructions:</b> Each question has a maximum of 2 checks. Correct answers lock immediately. After a second incorrect check, the answer locks and you can continue. Use the Check Answer button beneath each question.</p></section>';
{let words=DATA.vocab[i];let key="bank-v-"+i;if(!state.orders[key])state.orders[key]=shuffle(words.map(x=>x[0]));h+='<section class="panel"><h2>Match the Definitions</h2><p>Choose a vocabulary word for each definition.</p><div class="wordbank"><b>Word Bank:</b> '+state.orders[key].map(esc).join(" • ")+'</div>';words.forEach((pair,j)=>{let k=id("v",i,j),chosen=state.answers[k]||"";h+='<div class="question"><strong>'+(j+1)+'. '+esc(pair[1])+'</strong><select id="'+k+'" '+(locked(k)?"disabled":"")+'><option value="">Select a term</option>'+state.orders[key].map(w=>'<option '+(w===chosen?"selected":"")+' value="'+esc(w)+'">'+esc(w)+'</option>').join("")+'</select><button class="action question-check" '+(locked(k)?'disabled':'')+' onclick="checkVocabulary('+j+')">Check Answer</button><div class="feedback '+(state.completed[k]?"correct":locked(k)?"wrong":"")+'" id="fb-'+k+'">'+feedback(k)+'</div></div>'});h+='</section>'}
{h+='<section class="panel"><h2>Complete the Missing Code or Pseudocode</h2><p>Read each example carefully. Type <b>only what replaces the underscores (___)</b>, not the whole line. Lesson 2 uses <b>pseudocode</b>, which is different from Python. You have two checks per question.</p>';DATA.blanks[i].forEach((q,j)=>{let k=id("f",i,j),ok=locked(k);h+='<div class="question"><strong>'+(j+1)+'. '+esc(q.prompt)+'</strong><pre>'+esc(q.code)+'</pre><label for="'+k+'"><b>'+(i===1&&j===0?"Choose the missing symbol:":"Type the missing code:")+'</b></label>'+(i===1&&j===0?'<select class="code-input" id="'+k+'" '+(ok?"disabled":"")+' onchange="rememberCode(this)"><option value="">Select a symbol</option>'+["=","←","→",">="].map(sym=>'<option value="'+esc(sym)+'" '+(state.answers[k]===sym?"selected":"")+'>'+esc(sym)+'</option>').join("")+'</select>':'<input class="code-input" id="'+k+'" autocomplete="off" spellcheck="false" value="'+esc(state.answers[k]||"")+'" '+(ok?"disabled":"")+' oninput="rememberCode(this)">')<button class="action question-check" '+(locked(k)?'disabled':'')+' onclick="checkFill('+j+')">Check Answer</button><div class="feedback '+(state.completed[k]?"correct":locked(k)?"wrong":"")+'" id="fb-'+k+'">'+feedback(k)+'</div></div>'});h+='</section>'}

function begin(){let a=document.getElementById("first").value.trim(),b=document.getElementById("last").value.trim(),p=document.getElementById("period").value;if(!a||!b||!p){alert("Please enter your first name, last name, and class period.");return}state.first=a;state.last=b;state.period=p;sessionStorage.setItem(STARTED,"1");selectTab("Lesson 1")}
function updateChecks(prefix,items,getCorrect,questionIndex){let i=state.lesson;items.forEach((item,j)=>{if(j!==questionIndex)return;let k=id(prefix,i,j);if(locked(k))return;let el=document.getElementById(k),v=el.value;if(!v)return;state.answers[k]=v;state.attempts[k]=tries(k)+1;state.completed[k]=v===String(getCorrect(item));if(locked(k)){el.disabled=true;let btn=el.closest(".question").querySelector(".question-check");if(btn)btn.disabled=true}let fb=document.getElementById("fb-"+k);fb.textContent=state.completed[k]?"✓ Correct! Answer locked.":locked(k)?"✗ Two checks used. Answer locked.":"Not quite. 1 of 2 checks used. Try again.";fb.className="feedback "+(state.completed[k]?"correct":"wrong")});save();refreshStatus()}
function checkVocabulary(j){updateChecks("v",DATA.vocab[state.lesson],x=>x[0],j)}
function rememberCode(el){state.answers[el.id]=el.value;save()}
function rememberOrder(el){state.answers[id("o",state.lesson,0)]=el.value;save()}
function normalizeCode(v){return String(v).replace(/\r\n?/g,"\n").split("\n").map(x=>x.replace(/\s+$/,"")).filter(x=>x.trim()!=="").join("\n")}
function checkFill(questionIndex){let i=state.lesson;DATA.blanks[i].forEach((q,j)=>{if(j!==questionIndex)return;let k=id("f",i,j);if(locked(k))return;let el=document.getElementById(k),v=el.value.trim();if(!v)return;state.answers[k]=el.value;state.attempts[k]=tries(k)+1;state.completed[k]=v===q.answer;if(locked(k))el.disabled=true;let fb=document.getElementById("fb-"+k);fb.textContent=state.completed[k]?"✓ Correct! Answer locked.":locked(k)?"✗ Two checks used. Answer locked.":"Not quite. 1 of 2 checks used. Try again.";fb.className="feedback "+(state.completed[k]?"correct":"wrong")});save();refreshStatus()}
function checkQuick(questionIndex){let i=state.lesson;DATA.lessons[i].questions.forEach((q,j)=>{if(j!==questionIndex)return;let k=id("q",i,j);if(locked(k))return;let picked=document.querySelector('input[name="'+k+'"]:checked');if(!picked)return;let v=Number(picked.value);state.answers[k]=v;state.attempts[k]=tries(k)+1;state.completed[k]=v===q[2];if(locked(k)){document.querySelectorAll('input[name="'+k+'"]').forEach(el=>el.disabled=true);let btn=document.querySelector('input[name="'+k+'"]').closest(".question").querySelector(".question-check");if(btn)btn.disabled=true}let fb=document.getElementById("fb-"+k);fb.textContent=state.completed[k]?"✓ Correct! Answer locked.":locked(k)?"✗ Two checks used. Answer locked.":"Not quite. 1 of 2 checks used. Try again.";fb.className="feedback "+(state.completed[k]?"correct":"wrong")});save();refreshStatus()}
function refreshStatus(){document.getElementById("status").textContent="Practice questions: 30 • Finished: "+allCount()+"/30 • Correct: "+correctCount()+"/30 • Maximum 2 checks per question."}
let selectedOrderTile=null;
function orderKey(){return id("o",state.lesson,0)}
function orderPositions(){let k=orderKey(),n=DATA.lessons[state.lesson].lines.length;let p=state.positions[k];if(!Array.isArray(p)||p.length!==n){p=Array(n).fill(null);state.positions[k]=p}return p}
function orderTile(n){let e=document.createElement("span");e.className="tile";e.textContent=DATA.lessons[state.lesson].lines[n];e.draggable=!locked(orderKey());e.dataset.line=String(n);e.onclick=ev=>{ev.stopPropagation();if(locked(orderKey()))return;selectedOrderTile=n;document.querySelectorAll(".tile").forEach(t=>t.classList.remove("selected"));e.classList.add("selected")};e.ondragstart=ev=>{if(locked(orderKey())){ev.preventDefault();return}ev.dataTransfer.setData("text/plain",String(n))};return e}
function renderOrder(){let k=orderKey(),lines=DATA.lessons[state.lesson].lines,bank=document.getElementById("orderbank"),slots=document.getElementById("orderslots");if(!bank||!slots)return;if(!Array.isArray(state.orders[k])||state.orders[k].length!==lines.length)state.orders[k]=shuffle(lines.map((_,j)=>j));let pos=orderPositions();bank.innerHTML="";slots.innerHTML="";state.orders[k].forEach(n=>{if(!pos.includes(n))bank.appendChild(orderTile(n))});lines.forEach((_,j)=>{let box=document.createElement("div");box.className="slot";box.textContent=(j+1)+". ";if(pos[j]!==null)box.appendChild(orderTile(pos[j]));if(!locked(k)){box.ondragover=e=>e.preventDefault();box.ondrop=e=>{e.preventDefault();let n=Number(e.dataTransfer.getData("text/plain"));if(Number.isInteger(n)&&n>=0&&n<lines.length)placeOrder(n,j)};box.onclick=()=>{if(selectedOrderTile!==null)placeOrder(selectedOrderTile,j)}}slots.appendChild(box)});save()}
function placeOrder(n,j){let k=orderKey();if(locked(k))return;let p=orderPositions();let previous=p.indexOf(n);if(previous!==-1)p[previous]=null;let displaced=p[j];p[j]=n;state.positions[k]=p;selectedOrderTile=null;renderOrder();let fb=document.getElementById("orderfb");fb.textContent=feedback(k);fb.className="feedback"}
function checkOrder(){let k=orderKey();if(locked(k))return;let p=orderPositions();if(p.some(n=>n===null)){document.getElementById("orderfb").textContent="Place all code tiles before checking.";return}state.attempts[k]=tries(k)+1;let ok=p.every((n,j)=>n===j);state.completed[k]=ok;save();let fb=document.getElementById("orderfb");fb.className="feedback "+(ok?"correct":"wrong");fb.textContent=ok?"✓ Correct! Answer locked.":locked(k)?"✗ Two checks used. Answer locked.":"Not quite. You have one more try. Check the line order and indentation.";if(locked(k)){document.querySelector('button[onclick="checkOrder()"]').disabled=true;renderOrder()}refreshStatus()}
function nextActivity(){let ix=tabs.indexOf(state.tab);selectTab(tabs[Math.min(ix+1,tabs.length-1)]);window.scrollTo({top:0,behavior:"instant"})}
function resetLab(){if(confirm("Clear all saved answers and student information?")){localStorage.removeItem(KEY);sessionStorage.removeItem(STARTED);location.reload()}}
const GRADE_ENDPOINT="https://script.google.com/a/macros/benhillschools.org/s/AKfycbz9IipEcz2wq8Hbye5zC3pyuXFCW9_4PlutdfW3oRwfKcTW5jMgV3FqxNYVWupvJ8kO/exec";
async function submitGrade(){
 if(allCount()!==30||!state.first||!state.last||!state.period)return;
 const button=document.querySelector('button[onclick="submitGrade()"]');
 const message=document.getElementById("message");
 if(button){button.disabled=true;button.textContent="Sending…";}
 if(message)message.textContent="Sending your Chapter 15 score…";
 const payload={name:state.last+", "+state.first,period:state.period,chapter:"Chapter 15 | Designing Algorithms",score:Math.round(correctCount()/30*100)};
 try{
  await fetch(GRADE_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  state.submitted=true;save();
  if(message)message.textContent="Submission request sent. Check the Grade Checker or spreadsheet to confirm recording; this message does not confirm acceptance.";
  if(button)button.textContent="Send Results Again";
 }catch(error){
  if(message)message.textContent="Unable to send the score. Check your connection and try again.";
  if(button)button.textContent="Retry Submission";
 }
 if(button)button.disabled=false;
}
render();
